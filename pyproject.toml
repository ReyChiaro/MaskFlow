[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-flow"
version = "0.1.0"
description = "A mask based localization image editing method."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.0.0",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "prodigyopt>=1.1.2",
    "pyarrow>=24.0.0",
    "tensorboard>=2.20.0",
    #"torch>=2.11.0",
    "torch==2.8.0+cu128",
    "torch-fidelity",
    "torchmetrics",
    "torchvision",
    "transformers>=5.6.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[project.optional-dependencies]
lint = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["N", "E741", "F541", "F401"]

[tool.setuptools]
py-modules = []