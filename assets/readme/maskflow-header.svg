<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">MaskFlow</title>
  <desc id="description">A minimal purple-to-pink flowing banner for MaskFlow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee7ff"/>
      <stop offset="0.52" stop-color="#f4e5fa"/>
      <stop offset="1" stop-color="#ffe4f1"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#background)"/>
  <path d="M-70 201C137 87 300 240 506 136S861 54 1270 139" fill="none" stroke="url(#flow)" stroke-width="74" stroke-linecap="round" opacity="0.22" filter="url(#softGlow)"/>
  <path d="M-40 202C144 104 313 224 505 145S848 54 1245 133" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
  <path d="M-30 62C211 170 367 26 585 106S932 207 1235 78" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  <circle cx="165" cy="72" r="52" fill="#a855f7" opacity="0.05"/>
  <circle cx="1055" cy="198" r="76" fill="#ec4899" opacity="0.05"/>

  <text x="600" y="149" fill="#6d28a8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2" text-anchor="middle">MaskFlow</text>
</svg>
