input:
  source: ???
  mask: ???  # White pixels mark the edit region.
  prompt: ???
  negative_prompt: ""

checkpoint:
  sft_path: ???  # Training export directory: .../lora_adapter
  sft_adapter_name: maskflow

runtime:
  device: cuda
  dtype: bfloat16
  seed: 42
  num_inference_steps: 50
  text_cfg_scale: 4.0
  mask_cfg_scale: 1.0
  interaction_cfg_scale: null

output:
  path: outputs/inference/${now:%Y%m%d-%H%M%S}/result.png

pipeline:
  _target_: pipelines.qwenimage.qwenimage_maskflow.QwenImageMaskFlow
  _recursive_: true
  pretrained_model: Qwen/Qwen-Image-Edit-2511

  mask_dilation_kernel: 25
  mask_blur_kernel: 25
  mask_blur_sigma: 25.0

  rescale_cfg: true
  enable_pixel_blend: true

  enable_poisson_infer: true
  poisson_steps: [0.0, 1.0]
  poisson_lambda_e: 1
  poisson_lambda_s: 1
  poisson_num_iter: 50
  poisson_momentum: 0.1

  scheduler:
    _target_: schedulers.MaskFlowScheduler
    weighting_scheme: logit_normal
    logit_normal_mean: 0.0
    logit_normal_std: 1.0
    mode_scale: 1.29
    base_image_seq_len: 256
    base_shift: 0.5
    max_image_seq_len: 8192
    max_shift: 0.9
    shift: 1.0
    shift_power: 1
    time_shift_type: exponential
    use_dynamic_shifting: true
    unmask_with: noisy_source

hydra:
  run:
    dir: outputs/inference/${now:%Y%m%d-%H%M%S}/hydra
  job:
    chdir: false
