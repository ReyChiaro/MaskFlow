defaults:
  - pipeline: qwenimage_mask_flow
  - adapter: lora
  - _self_

dataset:
  root: ???
  data_file: ${dataset.root}/test.jsonl
  prompt_key: edit_instruction
  negative_prompt_key: negative_prompt

checkpoint:
  sft_path: null
  sft_weight_name: null  # Optional filename when sft_path is a Hugging Face repository ID.
  sft_adapter_name: maskflow
  dmd_path: null
  dmd_weight_name: null  # Optional filename when dmd_path is a Hugging Face repository ID.
  dmd_adapter_name: dmd

runtime:
  dtype: bfloat16
  seed: 42
  num_inference_steps: 50
  text_cfg_scale: 4.0
  mask_cfg_scale: 1.0

output:
  dir: outputs/inference_distributed
  image_dir: images

hydra:
  run:
    dir: ${output.dir}/hydra
  output_subdir: .hydra/rank-${oc.env:RANK,0}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}-rank-${oc.env:RANK,0}.log
  job:
    chdir: false
