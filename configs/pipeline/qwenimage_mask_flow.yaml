_target_: pipelines.QwenImageMaskFlowManager
_recursive_: false

pretrained_model_name_or_path: Qwen/Qwen-Image-Edit-2511
dilation_kernel_size: 25
blur_kernel_size: 25
blur_sigmas: 5
xt_unmask_strategy: noisy_x1
# If null, the noise scheduler will be initialized with diffusers FlowMatchEulerDiscreteScheduler
# else, use schedulers.flow_matching.RectifiedFlowMatchingScheduler
scheduler_configs:
  _target_: schedulers.flow_matching.RectifiedFlowMatchingScheduler
  weighting_scheme: logit_normal
  logit_normal_mean: 0.0
  logit_normal_std: 1.0
  mode_scale: 1.29
  base_image_seq_len: 256
  base_shift: 0.5
  max_image_seq_len: 8192
  max_shift: 0.9
  shift: 1.0
  shift_power: 1
  time_shift_type: exponential
  use_dynamic_shifting: true