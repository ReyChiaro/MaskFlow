_target_: pipelines.qwenimage.qwenimage_mask_flow.QwenImageMaskFlow
_recursive_: true

pretrained_model: Qwen/Qwen-Image-Edit-2511
# cfg_dropout: 0.1

mask_dilation_kernel: 25
mask_blur_kernel: 25
mask_blur_sigma: 25.0
mask_edge_width: 50

mask_loss_weight: 1.0
edge_loss_weight: 0.0

enable_vae_mask_encoding: true
enable_masked_loss: true
mask_denoise_steps: [0.0, 1.0]
mask_denoise_train: true
mask_denoise_infer: true
# inpainting_denoising_steps: 45

fsdp_configs:
  transformer.transformer_blocks:
    iterable: true
    reshard_after_forward: true

  text_pipeline.text_encoder.model.visual.blocks:
    iterable: true
    reshard_after_forward: true

  text_pipeline.text_encoder.model.language_model.layers:
    iterable: true
    reshard_after_forward: true

  # The root module are set at last
  transformer:
    iterable: false
    reshard_after_forward: false

  text_pipeline.text_encoder.model:
    iterable: false
    reshard_after_forward: false

# If null, the noise scheduler will be initialized with diffusers FlowMatchEulerDiscreteScheduler
# else, use schedulers.flow_matching.RectifiedFlowMatchingScheduler
scheduler:
  _target_: schedulers.MaskFlowScheduler
  weighting_scheme: logit_normal
  logit_normal_mean: 0.0
  logit_normal_std: 1.0
  mode_scale: 1.29
  base_image_seq_len: 256
  base_shift: 0.5
  max_image_seq_len: 8192
  max_shift: 0.9
  shift: 1.0
  shift_power: 1
  time_shift_type: exponential
  use_dynamic_shifting: true
  unmask_with: noisy_source
