defaults:
  - trainset: mask_edit
  - evalset: mask_edit
  - optimizer: prodigy
  - pipeline: qwenimage_mask_flow
  - project: train
  - adapter: lora
  - lr_scheduler: null
  - trainer: maskflow
  - _self_


hydra:
  run:
    dir: ${project.output_dir}/hydra-configs
  output_subdir: .hydra/rank-${oc.env:RANK,0}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}-rank-${oc.env:RANK,0}.log
