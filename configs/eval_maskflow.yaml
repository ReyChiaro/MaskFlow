defaults:
  - evalset: mask_edit
  - pipeline: qwenimage_maskflow
  - project: evaluation
  - adapter@sft_adapter: qwenimage_lora
  # There may be optional distill_adapter
  # - adapter@distill_adapter: dmd_lora
  - _self_

adapters:
  sft:
    path: null  # The trained weight path
    cfg: ${sft_adapter}
  # distill:
  #   path: null
  #   cfg: ${distill_adapter}

base_seed: 42
weight_dtype: bf16

batch_size_per_process: 1
num_workers: 4

text_cfg_scale: 4.0
num_inference_steps: 50
eval_with_position_prompt: false

hydra:
  run:
    dir: ${project.output_dir}/hydra-configs
