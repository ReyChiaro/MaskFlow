defaults:
  - trainset: mask_edit
  - evalset: mask_edit
  - optimizer: prodigy
  - pipeline: qwenimage_maskflow
  - project: train
  - adapter: qwenimage_lora
  - lr_scheduler: null
  - reward: clip
  - trainer: diffusion_nft
  - _self_

adapter:
  adapter_name: nft

hydra:
  run:
    dir: ${project.output_dir}/hydra-configs
  output_subdir: .hydra/rank-${oc.env:RANK,0}
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}-rank-${oc.env:RANK,0}.log
